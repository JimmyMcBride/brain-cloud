services:
  api:
    build: .
    environment:
      DATABASE_URL: ecto://brain:brain@postgres/brain
      DEV_ACTOR_ID: 00000000-0000-0000-0000-000000000001
      DEV_API_TOKEN: development-only-token
      PHX_HOST: localhost
      PHX_SERVER: "true"
      POOL_SIZE: "10"
      PORT: "4000"
      SECRET_KEY_BASE: development-only-secret-key-base-development-only-secret-key-base-1234
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
