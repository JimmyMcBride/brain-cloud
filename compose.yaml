services:
  api:
    build: .
    environment:
      BRAIN_CLOUD_ADDRESS: ":8080"
      BRAIN_CLOUD_LOG_LEVEL: info
      BRAIN_CLOUD_DATABASE_URL: postgres://brain:brain@postgres:5432/brain?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
