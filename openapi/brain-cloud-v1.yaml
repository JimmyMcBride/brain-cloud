openapi: 3.1.0
info:
  title: Brain Cloud API
  version: 0.0.0-dev
  description: Public, versioned protocol shared by hosted and self-hosted Brain Cloud servers, including capability-gated optional modules.
servers:
  - url: http://localhost:4000
x-reserved-paths:
  - /v1/modules
  - /v1/modules/{module_id}
  - /v1/modules/{module_id}/config
  - /v1/planning
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: Process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: getReadiness
      summary: Service readiness
      responses:
        "200":
          description: Service can receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                notReady:
                  value:
                    status: not_ready
  /v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Discover protocol compatibility, server capabilities, and enabled modules
      responses:
        "200":
          description: Server compatibility information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a cloud project
      description: Creates the project in the organization bound to the bearer token.
      x-required-scope: projects.create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/ProjectCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/projects/{project_id}/memories:
    post:
      operationId: createMemory
      summary: Create a memory with immutable revision 1
      x-required-scope: memory.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCreate"
      responses:
        "201":
          description: Memory and revision created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/MemoryCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/projects/{project_id}/memories/{memory_id}:
    get:
      operationId: getMemory
      summary: Retrieve a project-scoped memory and revision 1
      x-required-scope: memory.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Memory and immutable revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEnvelope"
              examples:
                found:
                  $ref: "#/components/examples/MemoryCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project_id}/search:
    get:
      operationId: searchProjectMemories
      summary: Search memory revisions by project-scoped keyword
      x-required-scope: search.keyword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: q
          in: query
          required: true
          description: Trimmed keyword query.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Ranked project-scoped keyword results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchEnvelope"
              examples:
                match:
                  $ref: "#/components/examples/SearchResults"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/auth/tokens:
    post:
      operationId: createApiToken
      summary: Create an API token for the caller's organization membership
      description: Requires an owner membership and tokens.manage. The raw token appears only in this successful response. Requested scopes must be a subset of the caller's scopes.
      x-required-role: owner
      x-required-scope: tokens.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: Token created; copy its one-time secret now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTokenEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/TokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listApiTokens
      summary: List API token metadata for the caller's organization
      description: Raw secrets and stored digests are never returned.
      x-required-role: owner
      x-required-scope: tokens.manage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization token metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/tokens/{token_id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token in the caller's organization
      x-required-role: owner
      x-required-scope: tokens.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204":
          description: Token revoked. Repeating the request is idempotent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bc1_<public_id>_<secret>
      description: Persisted organization-bound API token. Raw secrets are returned only when created.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: The bearer token is missing, malformed, unknown, expired, revoked, digest-mismatched, or bound to an inactive membership.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthorized
              message: Authentication required
              details: {}
    Forbidden:
      description: Valid credentials lack the required role or scope. This response occurs before protected resource lookup.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: forbidden
              message: Permission denied
              details: {}
    NotFound:
      description: The requested project or memory does not exist in the requested scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            project:
              value:
                error:
                  code: project_not_found
                  message: Project not found
                  details: {}
            memory:
              value:
                error:
                  code: memory_not_found
                  message: Memory not found
                  details: {}
    TokenNotFound:
      description: The API token does not exist in the caller's organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: token_not_found
              message: API token not found
              details: {}
    ValidationFailed:
      description: Request values failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: validation_failed
              message: Request validation failed
              details:
                title:
                  - should be at most 200 character(s)
  examples:
    ProjectCreated:
      value:
        project:
          id: 11111111-1111-4111-8111-111111111111
          organization_id: 44444444-4444-4444-8444-444444444444
          name: Research
          creator_actor_id: 00000000-0000-0000-0000-000000000001
          inserted_at: "2026-07-28T05:00:00.000000Z"
          updated_at: "2026-07-28T05:00:00.000000Z"
    MemoryCreated:
      value:
        memory:
          id: 22222222-2222-4222-8222-222222222222
          project_id: 11111111-1111-4111-8111-111111111111
          inserted_at: "2026-07-28T05:01:00.000000Z"
          updated_at: "2026-07-28T05:01:00.000000Z"
          revision:
            id: 33333333-3333-4333-8333-333333333333
            memory_id: 22222222-2222-4222-8222-222222222222
            revision_number: 1
            title: Phoenix Notes
            content: "# Durable\nPhoenix cloud memory"
            content_type: text/markdown
            content_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            actor_id: 00000000-0000-0000-0000-000000000001
            inserted_at: "2026-07-28T05:01:00.000000Z"
    TokenCreated:
      value:
        token:
          id: 55555555-5555-4555-8555-555555555555
          name: Read-only integration
          scopes: [memory.read, search.keyword]
          expires_at: null
          revoked_at: null
          bootstrap: false
          inserted_at: "2026-07-28T05:02:00.000000Z"
          token: bc1_0123456789abcdef0123456789abcdef_0123456789abcdef0123456789abcdef01234567890
    SearchResults:
      value:
        results:
          - memory_id: 22222222-2222-4222-8222-222222222222
            revision_id: 33333333-3333-4333-8333-333333333333
            revision_number: 1
            title: Phoenix Notes
            content_type: text/markdown
            content_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            excerpt: Durable Phoenix cloud memory
            rank: 0.06079271
            actor_id: 00000000-0000-0000-0000-000000000001
            inserted_at: "2026-07-28T05:01:00.000000Z"
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    SystemInfo:
      type: object
      additionalProperties: false
      required: [server, server_version, protocol_version, capabilities, modules]
      properties:
        server:
          const: brain-cloud
        server_version:
          type: string
        protocol_version:
          const: v1
        capabilities:
          type: array
          items:
            type: string
        modules:
          type: array
          description: Enabled module IDs. An empty list is valid.
          items:
            type: string
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    ProjectEnvelope:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, creator_actor_id, inserted_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        creator_actor_id:
          type: string
          format: uuid
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expires_at:
          type: [string, "null"]
          format: date-time
    TokenScope:
      type: string
      enum:
        - projects.create
        - memory.write
        - memory.read
        - search.keyword
        - tokens.manage
    TokenMetadata:
      type: object
      additionalProperties: false
      required: [id, name, scopes, expires_at, revoked_at, bootstrap, inserted_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        bootstrap:
          type: boolean
        inserted_at:
          type: string
          format: date-time
    CreatedToken:
      type: object
      additionalProperties: false
      required:
        [id, name, scopes, expires_at, revoked_at, bootstrap, inserted_at, token]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        bootstrap:
          type: boolean
        inserted_at:
          type: string
          format: date-time
        token:
          type: string
          pattern: "^bc1_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
          readOnly: true
    CreatedTokenEnvelope:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/CreatedToken"
    TokenListEnvelope:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenMetadata"
    MemoryCreate:
      type: object
      required: [title, content, content_type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Exact, untrimmed UTF-8 Markdown from 1 byte through 1 MiB.
          x-max-bytes: 1048576
        content_type:
          const: text/markdown
    MemoryEnvelope:
      type: object
      additionalProperties: false
      required: [memory]
      properties:
        memory:
          $ref: "#/components/schemas/Memory"
    Memory:
      type: object
      additionalProperties: false
      required: [id, project_id, inserted_at, updated_at, revision]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          $ref: "#/components/schemas/MemoryRevision"
    MemoryRevision:
      type: object
      additionalProperties: false
      required:
        - id
        - memory_id
        - revision_number
        - title
        - content
        - content_type
        - content_hash
        - actor_id
        - inserted_at
      properties:
        id:
          type: string
          format: uuid
        memory_id:
          type: string
          format: uuid
        revision_number:
          const: 1
        title:
          type: string
        content:
          type: string
        content_type:
          const: text/markdown
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        actor_id:
          type: string
          format: uuid
        inserted_at:
          type: string
          format: date-time
    SearchEnvelope:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchResult:
      type: object
      additionalProperties: false
      required:
        - memory_id
        - revision_id
        - revision_number
        - title
        - content_type
        - content_hash
        - excerpt
        - rank
        - actor_id
        - inserted_at
      properties:
        memory_id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
        revision_number:
          const: 1
        title:
          type: string
        content_type:
          const: text/markdown
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        excerpt:
          type: string
        rank:
          type: number
          format: float
        actor_id:
          type: string
          format: uuid
        inserted_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

# Reserved v1 areas: auth, users, organizations, teams, documents, context,
# sync, hive, conversations, proposals, agents, audit, modules,
# modules/{module_id}, modules/{module_id}/config, and planning. Schemas are
# added only with implemented operations. Planning remains optional; its
# absence is valid.
