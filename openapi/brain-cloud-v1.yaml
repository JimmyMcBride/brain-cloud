openapi: 3.1.0
info:
  title: Brain Cloud API
  version: 0.0.0-dev
  description: Public, versioned protocol shared by hosted and self-hosted Brain Cloud servers, including capability-gated optional modules.
servers:
  - url: http://localhost:4000
x-reserved-paths:
  - /v1/modules
  - /v1/modules/{module_id}
  - /v1/modules/{module_id}/config
  - /v1/planning
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: Process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: getReadiness
      summary: Service readiness
      responses:
        "200":
          description: Service can receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                notReady:
                  value:
                    status: not_ready
  /v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Discover protocol compatibility, server capabilities, and enabled modules
      responses:
        "200":
          description: Server compatibility information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /v1/organization/memberships:
    post:
      operationId: createOrganizationMembership
      summary: Create a human organization membership
      description: Reuses an existing normalized user without exposing a user lookup. Active and inactive duplicates require explicit caller handling.
      x-required-role: owner
      x-required-scope: members.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreate"
      responses:
        "201":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listOrganizationMemberships
      summary: List memberships in the caller's organization
      x-required-role: owner
      x-required-scope: members.manage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller-organization membership metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/organization/memberships/{membership_id}:
    patch:
      operationId: updateOrganizationMembershipRole
      summary: Change an organization membership role
      description: Demoting an owner revokes every credential bound to that membership. The final active owner cannot be demoted.
      x-required-role: owner
      x-required-scope: members.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRoleUpdate"
      responses:
        "200":
          description: Membership role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MembershipNotFound"
        "409":
          $ref: "#/components/responses/LastOwnerRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deactivateOrganizationMembership
      summary: Deactivate an organization membership
      description: Immediately revokes every credential bound to the membership. Repeating a completed deactivation is idempotent. The final active owner cannot be deactivated.
      x-required-role: owner
      x-required-scope: members.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "204":
          description: Membership deactivated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MembershipNotFound"
        "409":
          $ref: "#/components/responses/LastOwnerRequired"
  /v1/organization/memberships/{membership_id}/reactivate:
    post:
      operationId: reactivateOrganizationMembership
      summary: Reactivate an organization membership
      description: Reactivation never restores previously revoked credentials. Repeating a completed reactivation is idempotent.
      x-required-role: owner
      x-required-scope: members.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: Membership active; fresh credentials must be issued explicitly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MembershipNotFound"
  /v1/organization/memberships/{membership_id}/tokens:
    post:
      operationId: createOrganizationMembershipToken
      summary: Create a one-time credential for an organization membership
      description: The raw token appears only in this successful response. Requested scopes must be a subset of caller scopes; member memberships cannot receive members.manage, projects.manage_access, teams.manage, or tokens.manage.
      x-required-role: owner
      x-required-scopes: [members.manage, tokens.manage]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: Target-member token created; copy its one-time secret now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTokenEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/TokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MembershipNotFound"
        "409":
          $ref: "#/components/responses/MembershipInactive"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/organization/teams:
    post:
      operationId: createTeam
      summary: Create an organization team
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamWrite"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    get:
      operationId: listTeams
      summary: List active and deactivated organization teams
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Teams ordered by inserted_at and id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/organization/teams/{team_id}:
    patch:
      operationId: renameTeam
      summary: Rename an active or deactivated team
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TeamId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamWrite"
      responses:
        "200":
          description: Team renamed or already named as requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TeamNotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      operationId: deactivateTeam
      summary: Soft-deactivate a team while retaining links and grants
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TeamId"}]
      responses:
        "204": {description: Team is inactive; repeated requests are idempotent.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TeamNotFound"}
  /v1/organization/teams/{team_id}/reactivate:
    post:
      operationId: reactivateTeam
      summary: Reactivate a team and its retained access relationships
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TeamId"}]
      responses:
        "200":
          description: Team is active; repeated requests are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TeamNotFound"}
  /v1/organization/teams/{team_id}/members:
    get:
      operationId: listTeamMemberships
      summary: List retained organization-membership links for a team
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TeamId"}]
      responses:
        "200":
          description: Links ordered by inserted_at and id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembershipListEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TeamNotFound"}
  /v1/organization/teams/{team_id}/members/{membership_id}:
    put:
      operationId: putTeamMembership
      summary: Add an active organization membership to an active team
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: Link exists; repeated requests are idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembershipEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TeamOrMembershipNotFound"}
        "409": {$ref: "#/components/responses/TeamOrMembershipInactive"}
    delete:
      operationId: deleteTeamMembership
      summary: Remove a retained membership link
      description: Active and inactive teams/memberships are valid targets. Repeated requests are idempotent.
      x-required-role: owner
      x-required-scope: teams.manage
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "204": {description: Link absent after the operation.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TeamOrMembershipNotFound"}
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a cloud project
      description: Creates the project in the organization bound to the bearer token. Member creators receive an editor grant atomically; owners have implicit access and receive no grant.
      x-required-scope: projects.create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/ProjectCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/projects/{project_id}/access:
    get:
      operationId: listProjectAccessGrants
      summary: List direct human-membership access grants for a project
      description: Owners have implicit full access and are not represented by grants. Results are ordered by inserted_at and id.
      x-required-role: owner
      x-required-scope: projects.manage_access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Direct grants for the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessGrantListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
  /v1/projects/{project_id}/access/{membership_id}:
    put:
      operationId: putProjectAccessGrant
      summary: Create or replace a direct project access grant
      description: Repeating the same grant is idempotent. Inactive memberships cannot receive grants.
      x-required-role: owner
      x-required-scope: projects.manage_access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessGrantPut"
      responses:
        "200":
          description: Grant created, changed, or already in the requested state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessGrantEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectOrMembershipNotFound"
        "409":
          $ref: "#/components/responses/MembershipInactive"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteProjectAccessGrant
      summary: Revoke a direct project access grant
      description: A valid project and membership target returns 204 whether or not a grant exists. Inactive memberships are valid deletion targets.
      x-required-role: owner
      x-required-scope: projects.manage_access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "204":
          description: Grant absent after the operation.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectOrMembershipNotFound"
  /v1/projects/{project_id}/team-access:
    get:
      operationId: listTeamProjectAccessGrants
      summary: List team access grants for a project
      description: Includes grants retained for deactivated teams; direct grants remain on the separate access route.
      x-required-role: owner
      x-required-scope: projects.manage_access
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200":
          description: Team grants ordered by inserted_at and id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamProjectAccessGrantListEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
  /v1/projects/{project_id}/team-access/{team_id}:
    put:
      operationId: putTeamProjectAccessGrant
      summary: Create or replace an active team's project access
      x-required-role: owner
      x-required-scope: projects.manage_access
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessGrantPut"
      responses:
        "200":
          description: Grant created, changed, or already in the requested state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamProjectAccessGrantEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/ProjectOrTeamNotFound"}
        "409": {$ref: "#/components/responses/TeamInactive"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      operationId: deleteTeamProjectAccessGrant
      summary: Revoke a retained team project grant
      x-required-role: owner
      x-required-scope: projects.manage_access
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204": {description: Grant absent after the operation.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/ProjectOrTeamNotFound"}
  /v1/projects/{project_id}/memories:
    post:
      operationId: createMemory
      summary: Create a memory with immutable revision 1
      description: Requires owner access or a direct editor grant in addition to memory.write.
      x-required-scope: memory.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCreate"
      responses:
        "201":
          description: Memory and revision created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/MemoryCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/projects/{project_id}/memories/{memory_id}:
    get:
      operationId: getMemory
      summary: Retrieve a project-scoped memory and revision 1
      description: Requires owner access or a direct reader/editor grant in addition to memory.read.
      x-required-scope: memory.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Memory and immutable revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEnvelope"
              examples:
                found:
                  $ref: "#/components/examples/MemoryCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/{project_id}/search:
    get:
      operationId: searchProjectMemories
      summary: Search memory revisions by project-scoped keyword
      description: Requires owner access or a direct reader/editor grant in addition to search.keyword.
      x-required-scope: search.keyword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: q
          in: query
          required: true
          description: Trimmed keyword query.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Ranked project-scoped keyword results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchEnvelope"
              examples:
                match:
                  $ref: "#/components/examples/SearchResults"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/auth/tokens:
    post:
      operationId: createApiToken
      summary: Create an API token for the caller's organization membership
      description: Requires an owner membership and tokens.manage. The raw token appears only in this successful response. Requested scopes must be a subset of the caller's scopes.
      x-required-role: owner
      x-required-scope: tokens.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: Token created; copy its one-time secret now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTokenEnvelope"
              examples:
                created:
                  $ref: "#/components/examples/TokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listApiTokens
      summary: List API token metadata for the caller's organization
      description: Raw secrets and stored digests are never returned.
      x-required-role: owner
      x-required-scope: tokens.manage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization token metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/tokens/{token_id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token in the caller's organization
      x-required-role: owner
      x-required-scope: tokens.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "204":
          description: Token revoked. Repeating the request is idempotent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bc1_<public_id>_<secret>
      description: Persisted organization-bound API token. Raw secrets are returned only when created.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: The bearer token is missing, malformed, unknown, expired, revoked, digest-mismatched, or bound to an inactive membership.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthorized
              message: Authentication required
              details: {}
    Forbidden:
      description: Valid credentials lack the required role or scope. This response occurs before protected resource lookup.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: forbidden
              message: Permission denied
              details: {}
    NotFound:
      description: The requested project or memory does not exist in the requested scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            project:
              value:
                error:
                  code: project_not_found
                  message: Project not found
                  details: {}
            memory:
              value:
                error:
                  code: memory_not_found
                  message: Memory not found
                  details: {}
    ProjectNotFound:
      description: The project is missing, malformed, inaccessible, or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: project_not_found
              message: Project not found
              details: {}
    ProjectOrMembershipNotFound:
      description: The project or membership is missing, malformed, inaccessible, or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            project:
              value:
                error:
                  code: project_not_found
                  message: Project not found
                  details: {}
            membership:
              value:
                error:
                  code: membership_not_found
                  message: Organization membership not found
                  details: {}
    TokenNotFound:
      description: The API token does not exist in the caller's organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: token_not_found
              message: API token not found
              details: {}
    MembershipNotFound:
      description: The membership does not exist in the caller's organization. Missing, malformed, and cross-tenant IDs share this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: membership_not_found
              message: Organization membership not found
              details: {}
    MembershipConflict:
      description: The normalized user already has an active or inactive membership in the caller's organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            active:
              value:
                error:
                  code: membership_exists
                  message: Organization membership already exists
                  details: {}
            inactive:
              value:
                error:
                  code: membership_inactive
                  message: Organization membership is inactive
                  details: {}
    MembershipInactive:
      description: The target membership is inactive and cannot receive a credential or project grant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: membership_inactive
              message: Organization membership is inactive
              details: {}
    TeamNotFound:
      description: The team is missing, malformed, or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: team_not_found
              message: Team not found
              details: {}
    TeamOrMembershipNotFound:
      description: The team is evaluated before the organization membership; missing, malformed, and cross-tenant identifiers are concealed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            team:
              value: {error: {code: team_not_found, message: Team not found, details: {}}}
            membership:
              value: {error: {code: membership_not_found, message: Organization membership not found, details: {}}}
    ProjectOrTeamNotFound:
      description: The project is evaluated before the team; missing, malformed, and cross-tenant identifiers are concealed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            project:
              value: {error: {code: project_not_found, message: Project not found, details: {}}}
            team:
              value: {error: {code: team_not_found, message: Team not found, details: {}}}
    TeamInactive:
      description: The team is inactive and cannot receive new memberships or grants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: team_inactive
              message: Team is inactive
              details: {}
    TeamOrMembershipInactive:
      description: The target team or organization membership is inactive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            team:
              value: {error: {code: team_inactive, message: Team is inactive, details: {}}}
            membership:
              value: {error: {code: membership_inactive, message: Organization membership is inactive, details: {}}}
    LastOwnerRequired:
      description: The requested change would remove the final active organization owner.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: last_owner_required
              message: At least one active owner is required
              details: {}
    ValidationFailed:
      description: Request values failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: validation_failed
              message: Request validation failed
              details:
                title:
                  - should be at most 200 character(s)
