openapi: 3.1.0
info:
  title: Brain Cloud API
  version: 0.0.0-dev
  description: Public, versioned protocol shared by hosted and self-hosted Brain Cloud servers, including capability-gated optional modules.
servers:
  - url: http://localhost:8080
x-reserved-paths:
  - /v1/modules
  - /v1/modules/{module_id}
  - /v1/modules/{module_id}/config
  - /v1/planning
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: Process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: getReadiness
      summary: Service readiness
      responses:
        "200":
          description: Service can receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Discover protocol compatibility, server capabilities, and enabled modules
      responses:
        "200":
          description: Server compatibility information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
components:
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    SystemInfo:
      type: object
      additionalProperties: false
      required: [server, server_version, protocol_version, capabilities, modules]
      properties:
        server:
          const: brain-cloud
        server_version:
          type: string
        protocol_version:
          const: v1
        capabilities:
          type: array
          items:
            type: string
        modules:
          type: array
          description: Enabled module IDs. An empty list is valid.
          items:
            type: string

# Reserved v1 areas: auth, users, organizations, teams, projects, documents,
# memory, search, context, sync, hive, conversations, proposals, agents,
# audit, system, modules, modules/{module_id}, modules/{module_id}/config, and
# planning. Schemas will be added only with implemented operations. Planning
# remains an optional capability; its absence is valid.
